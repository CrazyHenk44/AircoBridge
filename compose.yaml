services:
  airco:
    image: "${AIRCO_IMAGE:-ghcr.io/crazyhenk44/aircobridge:latest}"
    restart: unless-stopped
    ports:
      - "${AIRCO_HTTP_BIND:-127.0.0.1}:${AIRCO_HTTP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      AIRCO_CONFIG_FILE: /app/config/aircos.json
      AIRCO_HISTORY_FILE: /app/data/airco-history.json
    volumes:
      - ./config:/app/config
      - ./data:/app/data
