services:
  airco:
    image: "${AIRCO_IMAGE:-ghcr.io/crazyhenk44/aircobridge:latest}"
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      HOST: "${AIRCO_HTTP_BIND:-0.0.0.0}"
      PORT: "${AIRCO_HTTP_PORT:-3000}"
      AIRCO_CONFIG_FILE: /app/config/aircos.json
      AIRCO_HISTORY_FILE: /app/data/airco-history.json
      AIRCO_PRESETS_FILE: /app/data/airco-presets.json
      AIRCO_BRIDGE_ID_FILE: /app/data/bridge-id
      AIRCO_MDNS_ENABLED: "${AIRCO_MDNS_ENABLED:-1}"
      AIRCO_MDNS_INTERFACE: "${AIRCO_MDNS_INTERFACE:-}"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
