name: Feature request
description: Suggest an improvement to AircoBridge
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the problem you want to solve and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized examples, mockups, or links that clarify the request.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues for a similar request.
          required: true
        - label: This request contains no credentials or installation-specific data.
          required: true
